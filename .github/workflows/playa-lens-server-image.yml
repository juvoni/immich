name: Playa Lens Server Image

on:
  workflow_dispatch:
  push:
    branches:
      - playa-lens/v2.7.5-social-shell

concurrency:
  group: playa-lens-server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/immich-server
  IMAGE_TAG_PREFIX: playa-lens-v2.7.5

jobs:
  build:
    name: Build and Push Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "sha_tag=${IMAGE_NAME}:${IMAGE_TAG_PREFIX}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_NAME}:${IMAGE_TAG_PREFIX}-latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ steps.meta.outputs.sha_tag }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

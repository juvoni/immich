name: Playa Lens Server Image

on:
  workflow_dispatch:
  push:
    branches:
      - playa-lens/v3.0.3-social-shell

concurrency:
  group: playa-lens-server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/immich-server
  IMAGE_TAG_PREFIX: playa-lens-v3.0.3

jobs:
  build:
    name: Build and Push Server
    if: github.ref == 'refs/heads/playa-lens/v3.0.3-social-shell'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "sha_tag=${IMAGE_NAME}:${IMAGE_TAG_PREFIX}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_NAME}:${IMAGE_TAG_PREFIX}-latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ steps.meta.outputs.sha_tag }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Attest server image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
